name: Cloud Metabolism & Architecture Orchestration

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  metabolism:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Materialize Sanctuaries
        run: python build_sanctuaries.py

      - name: Execute Metabolism
        run: python main.py

      - name: Git Auto-Commit and Push
        uses: endbug/git-auto-commit@v5
        with:
          message: "🔥 [Cloud Metabolism] Autonomous sweep & circulation executed."
          default_author: github-actions[bot]
          file_pattern: "Chaos/ Entropy/ Processor/ StrataCrystallization/ architecture.yml"
