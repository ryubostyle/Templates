name: Cloud Metabolism & Architecture Orchestration

on:
  # 1. 手動でのワークフロー起動を許可
  workflow_dispatch:
  
  # 2. 毎日深夜0時（UTC / 日本時間午前9時など）に定期実行する場合
  schedule:
    - cron: '0 0 * * *'

jobs:
  metabolism:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # リポジトリへの自動コミット・プッシュ権限

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install dependencies (PyYAML etc.)
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: 🏛️ Step 1: Materialize Sanctuaries (Architecture Builder)
        run: |
          python build_sanctuaries.py

      - name: 🔥 Step 2: Execute Metabolism & Circulation
        run: |
          python main.py

      - name: 🚀 Step 3: Git Auto-Commit & Push Strata Crystallization
        uses: endbug/git-auto-commit@v5
        with:
          message: "🔥 [Cloud Metabolism] Autonomous sweep & circulation executed."
          default_author: github-actions[bot]
          file_pattern: "Chaos/ Entropy/ Processor/ StrataCrystallization/ architecture.yml"
