name: Processor Autonomous Orchestration

on:
  # 1. 任意のタイミングで手動キック（Workflow Dispatch）
  workflow_dispatch:
  # 2. 定期的な自律代謝（例：毎日深夜0時や任意のスケジュール）
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write  # StrataCrystallization/ への結晶化コミット権限

jobs:
  kick-processor:
    runs-on: ubuntu-latest
    
    steps:
      - name: 🧭 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🔥 Kick Processor/baseProcessor.py
        run: |
          echo "🔥 [Cloud Metabolism] 雲上の環境で Processor のタクトを振ります..."
          python Processor/baseProcessor.py

      - name: 🏛️ Crystallize to Strata (Git Auto Commit)
        uses: endbug/git-auto-commit@v5
        with:
          commit_message: "📜 [Strata Archive] Cloud上の Processor 循環により生成されたスクロールを結晶化しました"
          branch: main
          file_pattern: StrataCrystallization/*
          default_author: github-actions[bot]
          skip_ci: true  # 無限ループの遮断
