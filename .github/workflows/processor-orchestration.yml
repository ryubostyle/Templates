name: Processor Autonomous Orchestration

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  kick-processor:
    runs-on: ubuntu-latest
    
    steps:
      - name: 🧭 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🔥 Kick Processor/baseProcessor.py
        run: |
          echo "🔥 [Cloud Metabolism] 雲上の環境で Processor のタクトを振ります..."
          python Processor/baseProcessor.py

      - name: 🏛️ Crystallize to Strata (Standard Git Commit)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # StrataCrystallization/ 配下の変更を検知してステージング
          git add StrataCrystallization/*
          
          # 変更がある場合のみコミット＆プッシュを実行
          if git diff --staged --quiet; then
            echo "🍃 [Strata Archive] 新たな結晶化スクロールはありませんでした。"
          else
            git commit -m "📜 [Strata Archive] 自律循環により生成されたスクロールを結晶化しました"
            git push
          fi
