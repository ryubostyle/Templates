name: Deploy Library-Scroll

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-scroll:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. ソースコードをチェックアウト
        uses: actions/checkout@v4

      - name: 2. Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 必要なパッケージ（PyYAMLやJinja2）のインストール
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML Jinja2

      - name: 4. 第一機の点火スイッチを実行
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          python library-scroll/run_demo.py

      - name: 5. 生成されたインデックスと地層をGitHubに自動保存（コミット）する
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add library-scroll/
          git status
          # 変更がある場合のみコミット＆プッシュ
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "✨ [Auto-Render] library-scroll のネガ自動生成と現像を完了"
            git push
          fi

