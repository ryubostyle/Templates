name: Auto-Render Library Scroll

on:
  push:
    paths:
      - 'library-scroll/trushes/**'
      - 'core/**'
  workflow_dispatch: # 手動でもいつでも点火できるようにする

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML

      - name: Ignite Recycling Plant
        run: |
          python library-scroll/run_demo.py

      # --- ここから「生のGitコマンド」による直結の理 ---
      - name: Configure Git Credentials
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and Push Generated Artifacts
        run: |
          git add library-scroll/ archives/ 2>/dev/null || true
          git status
          # 変更がある場合のみコミット＆プッシュを実行
          git diff --quiet && git diff --staged --quiet || git commit -m "✨ [Auto-Render] 多段式プラントのネガ自動生成と零点構築を完了"
          git push
