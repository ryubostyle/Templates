name: Auto-Render Library Scroll

on:
  push:
    paths:
      - 'library-scroll/trushes/**'
      - 'core/**'
  workflow_dispatch: # 手動でもいつでも点火できるようにする

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML

      - name: Ignite Recycling Plant
        run: |
          python library-scroll/run_demo.py

      - name: Commit and Push Generated Artifacts
        uses: stefanzew/git-auto-commit-action@v5
        with:
          commit_message: "✨ [Auto-Render] 多段式プラントのネガ自動生成と零点構築を完了"
          branch: main
