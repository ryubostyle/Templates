name: Deploy Library-Scroll

on:
  push:
    paths:
      - 'library-scroll/**'  # library-scroll 内に変化があったときに発動

jobs:
  render-scroll:
    runs-on: ubuntu-latest
    steps:
      - name: 1. ソースコードをチェックアウト
        uses: actions/checkout@v4

      - name: 2. Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 必要なパッケージ（PyYAMLやJinja2）のインストール
        run: |
          pip install PyYAML Jinja2

      - name: 4. 第一機の点火スイッチを実行
        run: |
          python library-scroll/run_demo.py

      - name: 5. 生成されたインデックスをGitHubに自動保存（コミット）する
        run: |
          git config --global user.name "ryubo-style-bot"
          git config --global user.email "bot@ryubostyle.com"
          git add library-scroll/index.md
          git commit -m "Auto-projected scroll from GitHub Actions [skip ci]" || exit 0
          git push
